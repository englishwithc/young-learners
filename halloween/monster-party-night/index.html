<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster Party Night — Halloween Games</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="title-mode">

<!-- ============ SVG sprite (keeps icons crisp, no emoji font needed) ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-pumpkin" viewBox="0 0 64 64">
    <path d="M32 8c2 0 3 2 3 5" stroke="#4E8A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="32" cy="38" rx="24" ry="21" fill="#F5821F"/>
    <ellipse cx="32" cy="38" rx="13" ry="21" fill="#FF9E3D" opacity=".55"/>
    <path d="M20 30l6 5-6 5z" fill="#1A1225"/>
    <path d="M44 30l-6 5 6 5z" fill="#1A1225"/>
    <path d="M21 42q11 10 22 0" stroke="#1A1225" stroke-width="4" fill="none" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-candy" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="14" fill="#E23E57"/>
    <path d="M18 32l-11-8v16z" fill="#FFC93C"/>
    <path d="M46 32l11-8v16z" fill="#FFC93C"/>
    <path d="M25 27q3 5 0 10" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-map" viewBox="0 0 64 64">
    <path d="M8 14l16-4 16 4 16-4v36l-16 4-16-4-16 4z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <path d="M24 10v36M40 14v36" stroke="currentColor" stroke-width="3" opacity=".7"/>
  </symbol>

  <symbol id="i-sound-on" viewBox="0 0 64 64">
    <path d="M10 26h9l14-12v36L19 38h-9z" fill="currentColor"/>
    <path d="M42 24q7 8 0 16M49 18q12 14 0 28" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-sound-off" viewBox="0 0 64 64">
    <path d="M10 26h9l14-12v36L19 38h-9z" fill="currentColor"/>
    <path d="M42 24l14 16M56 24L42 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-lock" viewBox="0 0 64 64">
    <rect x="14" y="28" width="36" height="28" rx="7" fill="currentColor"/>
    <path d="M22 28v-7a10 10 0 0120 0v7" stroke="currentColor" stroke-width="6" fill="none"/>
  </symbol>

  <symbol id="i-star" viewBox="0 0 64 64">
    <path d="M32 4l8.2 17.3 19 2.3-14 13.2 3.6 18.8L32 46.5 15.2 55.6l3.6-18.8-14-13.2 19-2.3z" fill="currentColor"/>
  </symbol>

  <symbol id="i-teacher" viewBox="0 0 64 64">
    <circle cx="32" cy="22" r="10" fill="currentColor"/>
    <path d="M12 58c0-11 9-18 20-18s20 7 20 18z" fill="currentColor"/>
  </symbol>

  <symbol id="i-door" viewBox="0 0 64 64">
    <path d="M14 56V24a18 18 0 0136 0v32z" fill="currentColor"/>
    <circle cx="43" cy="38" r="3" fill="#1A1225"/>
  </symbol>

  <symbol id="i-potion" viewBox="0 0 64 64">
    <path d="M26 8h12v10l10 16a14 14 0 01-12 21h-8a14 14 0 01-12-21l10-16z" fill="currentColor"/>
    <path d="M19 40h26a14 14 0 01-26 0z" fill="#1A1225" opacity=".45"/>
  </symbol>

  <symbol id="i-paw" viewBox="0 0 64 64">
    <ellipse cx="32" cy="42" rx="14" ry="12" fill="currentColor"/>
    <circle cx="18" cy="28" r="6" fill="currentColor"/>
    <circle cx="30" cy="22" r="6" fill="currentColor"/>
    <circle cx="43" cy="23" r="6" fill="currentColor"/>
    <circle cx="51" cy="33" r="5.5" fill="currentColor"/>
  </symbol>

  <symbol id="i-party" viewBox="0 0 64 64">
    <path d="M10 54l14-40 26 26z" fill="currentColor"/>
    <circle cx="46" cy="14" r="4" fill="currentColor" opacity=".7"/>
    <circle cx="56" cy="30" r="3" fill="currentColor" opacity=".7"/>
    <circle cx="34" cy="8" r="2.6" fill="currentColor" opacity=".7"/>
  </symbol>

  <symbol id="i-bat" viewBox="0 0 64 64">
    <path d="M32 24c-2-5-7-8-12-7 1 2 1 4 0 6-4 3-9 2-12-1 0 7 3 12 8 15-2 3-2 7 0 10 4-5 9-7 13-6 1 3 2 5 3 5s2-2 3-5c4-1 9 1 13 6 2-3 2-7 0-10 5-3 8-8 8-15-3 3-8 4-12 1-1-2-1-4 0-6-5-1-10 2-12 7z" fill="currentColor"/>
  </symbol>

  <symbol id="i-heart" viewBox="0 0 64 64">
    <path d="M32 56S6 40 6 24a13 13 0 0126-6 13 13 0 0126 6c0 16-26 32-26 32z" fill="currentColor"/>
  </symbol>

  <symbol id="i-check" viewBox="0 0 64 64">
    <path d="M10 34l13 13 31-31" stroke="currentColor" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-spin" viewBox="0 0 64 64">
    <path d="M32 10a22 22 0 11-16 6" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M16 8v10h10" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="6" fill="currentColor"/>
  </symbol>

  <symbol id="i-touch" viewBox="0 0 64 64">
    <path d="M24 34V16a5 5 0 0110 0v18" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M34 34V26a5 5 0 0110 0v8" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M44 34v18a12 12 0 01-12 12h-6a12 12 0 01-12-12V34z" fill="currentColor" opacity=".55"/>
  </symbol>

  <symbol id="i-bubble" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="4"/>
    <circle cx="24" cy="24" r="6" fill="currentColor" opacity=".55"/>
  </symbol>

  <symbol id="i-lock-big" viewBox="0 0 64 64">
    <rect x="14" y="28" width="36" height="28" rx="7" fill="currentColor"/>
    <path d="M22 28v-7a10 10 0 0120 0v7" stroke="currentColor" stroke-width="6" fill="none"/>
  </symbol>
</svg>

<div class="sky" aria-hidden="true">
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
  <svg class="bat b1"><use href="#i-bat"/></svg>
  <svg class="bat b2"><use href="#i-bat"/></svg>
  <svg class="bat b3"><use href="#i-bat"/></svg>
  <div class="fog f1"></div>
  <div class="fog f2"></div>
</div>

<div id="sceneBg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-icon"><use href="#i-pumpkin"/></svg>
    <span class="brand-text">Monster Party Night</span>
  </div>
  <div class="topbar-right">
    <div class="jar" id="jar" title="Candy collected">
      <div class="jar-fill" id="jarFill"></div>
      <svg class="jar-icon"><use href="#i-candy"/></svg>
      <span class="jar-count" id="jarCount">0</span>
    </div>
    <button class="mini-btn" id="btnMap" title="Spooky Street (M)">
      <svg><use href="#i-map"/></svg>
    </button>
    <button class="mini-btn" id="btnSound" title="Sound on/off (S)">
      <svg><use href="#i-sound-on"/></svg>
    </button>
  </div>
</header>

<main id="stage"></main>

<div id="ribbon">
  <svg class="ribbon-icon"><use href="#i-teacher"/></svg>
  <span id="ribbonText"></span>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script src="game.js"></script>
</body>
</html>
