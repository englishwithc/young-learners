function hash(x,y){let h=(x*374761393+y*668265263)^0x5bf03635;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

function rr(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function box(x,y,w,h,r,fill,stroke,lw){
  rr(x,y,w,h,r||0);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke&&lw!==0){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}
}
function txt(s,x,y,size,color,align){

}

function drawGear(cx,cy,r){
  ctx.save();ctx.translate(cx,cy);
  for(let i=0;i<8;i++){
    ctx.save();ctx.rotate(i*Math.PI/4);
    box(-r*0.22,-r*1.08,r*0.44,r*0.5,2,'#fbfbf2','#2f3550',2.5);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,r*0.86,0,7);
  ctx.fillStyle='#fbfbf2';ctx.fill();
  ctx.strokeStyle='#2f3550';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*0.34,0,7);
  ctx.fillStyle='#2f3550';ctx.fill();
  ctx.restore();
}
function miniSpeaker(x,y,s,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x-s*0.55,y-s*0.22);
  ctx.lineTo(x-s*0.25,y-s*0.22);
  ctx.lineTo(x+s*0.08,y-s*0.58);
  ctx.lineTo(x+s*0.08,y+s*0.58);
  ctx.lineTo(x-s*0.25,y+s*0.22);
  ctx.lineTo(x-s*0.55,y+s*0.22);
  ctx.closePath();ctx.fill();
}

/* ================== timers ================== */
let timers=[],tweens=[];
function after(ms,fn){timers.push({t:ms,fn});}
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done});}
function updateTimers(dt){
  for(let i=timers.length-1;i>=0;i--){const x=timers[i];x.t-=dt;if(x.t<=0){timers.splice(i,1);x.fn();}}
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i];w.t+=dt;const p=Math.min(1,w.t/w.dur);w.fn(p);
    if(p>=1){tweens.splice(i,1);if(w.done)w.done();}
  }
}

/* ================== sound ================== */
let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,dur,type,vol,slideTo){
  if(muted||!ac())return;
  try{
    const a=AC,o=a.createOscillator(),g=a.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,a.currentTime);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.05,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+0.02);
  }catch(e){}
}

function loadSettings(){
  try{
    const d=JSON.parse(localStorage.getItem(CFG_KEY)||'null');
    if(!d)return;
    if(d.mix)for(const k in CONFIG.mix)if(typeof d.mix[k]==='number')CONFIG.mix[k]=d.mix[k];
    if(typeof d.speed==='number')CONFIG.speed=d.speed;
    if(typeof d.enemyHP==='number')CONFIG.enemyHP=d.enemyHP;
    if(typeof d.enc==='number')CONFIG.encounterRate=d.enc;
    if(d.enabled){
      if(Array.isArray(d.enabled.cvc))
        CONFIG.enabled.cvc=d.enabled.cvc.filter(w=>WORDS.some(o=>o.w===w));
      if(Array.isArray(d.enabled.vocab))
        CONFIG.enabled.vocab=d.enabled.vocab.filter(g=>g==='colour'||g==='family');
      if(Array.isArray(d.enabled.rel))

      if(CONFIG.enabled.vocab.length<1)CONFIG.enabled.vocab=['colour','family'];
      if(CONFIG.enabled.rel.length<4)CONFIG.enabled.rel=RELS.slice();

/* ================== speech ================== */
let VOICE=null,VTRY=0,TTS_READY=false;
let speechUnlocked=false,speakTok=0,BADVOICE=false;

function hasTTS(){return 'speechSynthesis' in window;}
function pickVoice(){
  if(!hasTTS())return;
  let v=[];
  try{v=speechSynthesis.getVoices();}catch(e){v=[];}
  if(!v.length){if(VTRY++<50)setTimeout(pickVoice,200);return;}
  VOICE=v.find(x=>/en[-_]GB/i.test(x.lang)&&/female|kate|serena|sonia|libby|hazel/i.test(x.name))
    ||v.find(x=>/en[-_]GB/i.test(x.lang))
    ||v.find(x=>/en[-_]US/i.test(x.lang))
    ||v.find(x=>/^en/i.test(x.lang))
    ||v[0];
  TTS_READY=!!VOICE;
}
if(hasTTS()){
  pickVoice();
  try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
}
function unlockSpeech(){
  if(speechUnlocked||!hasTTS())return;
  speechUnlocked=true;
  try{
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0;u.rate=2;
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
  }catch(e){}
}
function audioOK(){return TTS_READY&&!muted&&!BADVOICE;}
function speakWord(text,rate){
  if(!audioOK())return;
  const tok=++speakTok;
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{
    if(tok!==speakTok||!audioOK())return;
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=(VOICE&&VOICE.lang)?VOICE.lang:'en-GB';
      if(VOICE)u.voice=VOICE;
      u.rate=rate||CONFIG.speed;u.pitch=1.15;u.volume=1;
      u.onerror=ev=>{
        const err=(ev&&ev.error)||'';
        if(err&&err!=='interrupted'&&err!=='canceled'){
          console.warn('TTS failed:',err);
          if(err==='not-allowed'||err==='synthesis-failed')BADVOICE=true;
        }
      };
      speechSynthesis.speak(u);
    }catch(e){BADVOICE=true;}
  },70);
}
function stopSpeech(){speakTok++;try{speechSynthesis.cancel();}catch(e){}}
function audioStatus(){
  if(!hasTTS())return 'NO SPEECH';
  if(muted)return 'MUTED (M)';
  if(BADVOICE)return 'AUDIO BLOCKED';
  if(!TTS_READY)return 'LOADING VOICE';
  return 'SOUND OK';
}

/* ================== preposition art ================== */
function prepScene(rel){
  return (x,y,w,h)=>{
    const u=Math.min(w,h)/46;
    const bw=26*u,bh=18*u;
    const cx=x+w/2,cy=y+h/2;
    const drawBox=(bx2,by2)=>{
      box(bx2,by2,bw,bh,2*u,'#c99a5b','#5a3d1f',2);
      ctx.strokeStyle='#a97c43';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(bx2+2,by2+bh/2);ctx.lineTo(bx2+bw-2,by2+bh/2);ctx.stroke();
    };
    const drawBall=(px,py,r)=>{
      const rad=r||7*u;
      ctx.beginPath();ctx.arc(px,py,rad,0,7);
      ctx.fillStyle='#f2c14e';ctx.fill();
      ctx.strokeStyle='#2b2b3a';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(px,py,rad,Math.PI*0.15,Math.PI*0.85);
      ctx.strokeStyle='#e5484d';ctx.lineWidth=3;ctx.stroke();
    };
    const bx=cx-bw/2,by=cy-bh/2;
    if(rel==='between'){
      const gap=bw*0.55;
      drawBox(cx-gap-bw,by);drawBox(cx+gap,by);
      drawBall(cx,cy+bh*0.15);
      return;
    }
    if(rel==='under'){drawBall(cx,by+bh+8*u);drawBox(bx,by);return;}
    if(rel==='behind'){drawBall(cx,by-5*u);drawBox(bx,by);return;}
    if(rel==='in'){
      box(bx,by,bw,bh,2*u,'#8a6234','#5a3d1f',2);
      drawBall(cx,cy+bh*0.10);
      box(bx,by,bw*0.16,bh,1,'#c99a5b','#5a3d1f',2);
      box(bx+bw*0.84,by,bw*0.16,bh,1,'#c99a5b','#5a3d1f',2);
      box(bx,by+bh*0.82,bw,bh*0.18,1,'#c99a5b','#5a3d1f',2);
      return;
    }
    drawBox(bx,by);
    if(rel==='on')drawBall(cx,by-7*u);
    else if(rel==='next to')drawBall(bx+bw+11*u,by+bh*0.5);
    else if(rel==='in front of')drawBall(cx+bw*0.42,by+bh+5*u);
  };
}

/* ================== generators ================== */
function opts(correct,n,pool){
  const s=new Set([correct]);
  for(const c of shuffle(pool.slice())){if(s.size>=n)break;s.add(c);}
  return shuffle([...s]).slice(0,n);
}
function optsPics(correct,n){
  const src=wordEntry(correct);
  const used=new Set([correct]);
  const out=[correct];
  for(const c of shuffle(activeWords())){
    if(out.length>=n)break;
    if(used.has(c.w))continue;
    if(src&&src.e===c.e)continue;
    used.add(c.w);out.push(c.w);
  }
  return shuffle(out);
}
function optsVocabPics(v,n){
  const used=new Set([v.w]);
  const out=[v.w];
  const add=list=>{
    for(const o of shuffle(list)){
      if(out.length>=n)break;
      if(used.has(o.w))continue;
      if(v.e&&o.e&&o.e===v.e)continue;
      if(v.c&&o.c&&o.c===v.c)continue;
      used.add(o.w);out.push(o.w);
    }
  };
  const av=activeVocab();
  add(av.filter(o=>o.g===v.g&&o.w!==v.w));
  if(out.length<n)add(av);
  if(out.length<n)add(VOCAB);
  return shuffle(out);
}

  const i=ri(0,t.w.length-1);
  return {kind:'letter',chip:CHIP.letter,hear:false,layout:'letters',
    answer:t.w[i],options:opts(t.w[i],4,KNOWN),art:artWordGap(t.w,i),audio:t.w};
}
function qFirst(){
  const t=pick(activeWords());
  return {kind:'first',chip:CHIP.first,hear:true,layout:'letters',
    answer:t.w[0],options:opts(t.w[0],4,KNOWN),art:artPicture(t),audio:t.w};
}
function qRhyme(){
  const list=activeWords();
  const t=pick(list);
  const r=list.filter(o=>o.w!==t.w&&o.w.slice(-2)===t.w.slice(-2));
  if(!r.length)return qPicture();
  const pr=pick(r);
  return {kind:'rhyme',chip:CHIP.rhyme,hear:true,layout:'words',
    answer:pr.w,options:opts(pr.w,4,list.filter(o=>o.w!==t.w).map(o=>o.w)),
    art:artPicture(t),audio:t.w};
}
function qVocab(){
  const v=pick(activeVocab());
  return {kind:'vocab',chip:CHIP.vocab,hear:true,layout:'pics',
    answer:v.w,options:optsVocabPics(v,4),art:artSpeaker(),audio:v.w};
}
function qWhere(){
  const rel=pick(activeRels());
  return {kind:'where',chip:CHIP.where,hear:true,layout:'prep',
    answer:rel,options:opts(rel,4,activeRels()),art:artSpeaker(),
    audio:'The ball is '+rel+' the box.'};
}

const QTYPES=[
  {k:'listen',gen:qListen},{k:'picture',gen:qPicture},
  {k:'picchoice',gen:qPicChoice},{k:'letter',gen:qMissing},
  {k:'first',gen:qFirst},{k:'rhyme',gen:qRhyme},
  {k:'vocab',gen:qVocab},{k:'where',gen:qWhere}
];

let lastAns='';
function makeQuestion(){
  const mix=Object.assign({},CONFIG.mix);
  if(!audioOK()){
    mix.listen=0;mix.picchoice=0;mix.first=0;mix.rhyme=0;mix.vocab=0;mix.where=0;
  }
  let total=0;
  for(const t of QTYPES)total+=Math.max(0,mix[t.k]||0);
  if(total<=0){mix.picture=30;mix.letter=30;total=60;}
  let q=null;
  for(let attempt=0;attempt<6;attempt++){
    let r=Math.random()*total,gen=QTYPES[0].gen;
    for(const t of QTYPES){
      const w=Math.max(0,mix[t.k]||0);
      if(w<=0)continue;
      r-=w;
      if(r<=0){gen=t.gen;break;}
    }
    q=gen();
    if(q.answer!==lastAns)break;
  }
  lastAns=q.answer;
  return q;
}

function freshState(){
  return {mode:'title',map:'out',caught:[],shiny:[],team:[],starter:null,
    bananas:0,bananasBeaten:0,coins:0,up:{atk:0,hp:0,bag:0,streak:0},
    quest:0,metProf:false,winShown:false};
}
let state=freshState();
let winOpen=false,panel=null,panelIdx=0;

function maxHP(id){return TOYS[id].hp+state.up.hp*12;}
function atkOf(id){return TOYS[id].atk+state.up.atk*2;}
function bagMax(){return Math.min(9,6+state.up.bag);}
function costOf(u){return Math.round(u.base*(1+state.up[u.id]*0.7));}

function save(){
  try{
    localStorage.setItem('toymon_v5',JSON.stringify({
      caught:state.caught,shiny:state.shiny,starter:state.starter,
      bananas:state.bananas,bananasBeaten:state.bananasBeaten,coins:state.coins,
      up:state.up,quest:state.quest,team:state.team,winShown:state.winShown
    }));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('toymon_v5')||'null');
    if(!d||!d.starter||!TOYS[d.starter])return;
    state.starter=d.starter;
    state.caught=(d.caught||[]).filter(id=>TOYS[id]);
    state.shiny=(d.shiny||[]).filter(id=>TOYS[id]);
    state.bananas=d.bananas||0;
    state.bananasBeaten=d.bananasBeaten||0;
    state.coins=d.coins||0;
    state.quest=d.quest||0;
    state.winShown=!!d.winShown;
    if(d.up)for(const k in state.up)if(typeof d.up[k]==='number')state.up[k]=d.up[k];
    state.team=(d.team||[]).filter(t=>TOYS[t.id]).map(t=>({
      id:t.id,hp:clamp(t.hp,0,maxHP(t.id)),shiny:!!t.shiny
    }));
    if(!state.team.length){
      state.team=[{id:state.starter,hp:maxHP(state.starter),shiny:false}];
    }
  }catch(e){}
}

/* ================== maps ================== */
let MAP=null;

function buildOutside(){
  const W=34,H=26,tiles=[];
  for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++)row.push('.');tiles.push(row);}
  const set=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)tiles[y][x]=c;};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(x<2||x>=W-2||y<2||y>=H-2)tiles[y][x]='#';
  }
  for(let y=3;y<=9;y++)for(let x=24;x<=31;x++)set(x,y,'g');
  for(let y=10;y<=12;y++)for(let x=3;x<=30;x++)set(x,y,'p');
  for(const [x,y] of [[3,4],[7,3],[12,3],[17,3],[21,4],[22,7],
                      [6,16],[13,17],[19,16],[26,16],[30,18],[9,20],[16,21],[24,21]]){
    if(tiles[y][x]==='.')tiles[y][x]='#';
  }
  const B=[[4,5,5,4],[10,5,5,4],[16,5,5,4]];
  for(const [bx,by,bw,bh] of B){
    for(let y=by;y<by+bh;y++)for(let x=bx;x<bx+bw;x++)set(x,y,'#');
  }
  set(6,9,'D');set(12,9,'D');set(18,9,'D');
  set(23,11,'S');
  return {
    id:'out',kind:'out',w:W,h:H,tiles,
    doors:[
      {x:6,y:9,to:'prof',sx:5,sy:6,dir:'up'},
      {x:12,y:9,to:'shop',sx:5,sy:6,dir:'up'},
      {x:18,y:9,to:'heal',sx:5,sy:6,dir:'up'}
    ],
    npcs:[],
    signs:[{x:23,y:11,text:'GRASS = TOYS'}],
    decor:[
      {type:'house',x:4,y:5,w:5,h:4,roof:'#c0503f'},
      {type:'house',x:10,y:5,w:5,h:4,roof:'#3b6fd4'},
      {type:'house',x:16,y:5,w:5,h:4,roof:'#3f8f43'},
      {type:'flowers',x:3,y:13},{type:'flowers',x:14,y:13},
      {type:'flowers',x:21,y:14},{type:'flowers',x:27,y:11},
      {type:'flowers',x:8,y:17},{type:'flowers',x:20,y:18}
    ]
  };
}
function buildInterior(kind){
  const W=11,H=8,tiles=[];
  for(let y=0;y<H;y++){
    const row=[];
    for(let x=0;x<W;x++)row.push((x===0||y===0||x===W-1||y===H-1)?'#':'.');
    tiles.push(row);
  }
  tiles[1][1]='s';tiles[1][2]='s';tiles[1][8]='s';tiles[1][9]='s';
  tiles[7][5]='D';
  const back = kind==='prof'?{x:6,y:10}:(kind==='shop'?{x:12,y:10}:{x:18,y:10});
  const floor = kind==='shop'?'#cfd8ea':(kind==='heal'?'#d8ece0':'#e0b078');
  return {
    id:kind,kind:kind,w:W,h:H,tiles,floor:floor,
    doors:[{x:5,y:7,to:'out',sx:back.x,sy:back.y,dir:'down'}],
    npcs:[{x:5,y:3,type:kind}],
    signs:[],
    decor:[{type:'rug',x:4,y:5,w:3,h:2}]
  };
}
function walkable(x,y){
  if(x<0||y<0||x>=MAP.w||y>=MAP.h)return false;
  const ch=MAP.tiles[y][x];
  if(ch==='#'||ch==='~'||ch==='s')return false;
  if(MAP.npcs.some(n=>n.x===x&&n.y===y))return false;
  if(MAP.signs.some(s=>s.x===x&&s.y===y))return false;
  return true;
}

/* ================== world ================== */
const player={gx:6,gy:12,dir:'down',walk:0};
let move=null,bumpCd=0,trans=null;
function startTrans(cb){if(trans)return;trans={t:0,dur:660,cb:cb,fired:false};SFX.warp();}
function updateTrans(dt){
  if(!trans)return;
  trans.t+=dt;
  const p=trans.t/trans.dur;
  if(p>=0.5&&!trans.fired){trans.fired=true;trans.cb();}
  if(p>=1)trans=null;
}
function setMap(id,tx,ty,dir){
  MAP=id==='out'?buildOutside():buildInterior(id);
  state.map=id;
  player.gx=tx;player.gy=ty;player.dir=dir||'down';
  move=null;player.walk=0;
}
const worldX=()=>(move?lerp(move.fx,move.tx,move.t):player.gx)*T;
const worldY=()=>(move?lerp(move.fy,move.ty,move.t):player.gy)*T;

function tryMove(dx,dy){
  if(dlg.on||trans||winOpen||panel)return;
  player.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';
  const nx=player.gx+dx,ny=player.gy+dy;
  if(!walkable(nx,ny)){
    const now=performance.now();
    if(now>bumpCd){SFX.bump();bumpCd=now+350;}
    return;
  }
  move={fx:player.gx,fy:player.gy,tx:nx,ty:ny,t:0};
}
function onStep(){
  const door=MAP.doors.find(d=>d.x===player.gx&&d.y===player.gy);
  if(door){startTrans(()=>setMap(door.to,door.sx,door.sy,door.dir));return;}
  if(MAP.tiles[player.gy][player.gx]==='g'&&Math.random()<CONFIG.encounterRate)encounter();
}
function encounter(){
  if(Math.random()<CONFIG.bananaChance){startBattle('banana',false);return;}
  if(state.caught.length>=TOY_ORDER.length){startBattle(pick(TOY_ORDER),true);return;}
  const left=TOY_ORDER.filter(id=>!state.caught.includes(id));
  if(!left.length)return;
  startBattle(pick(left),false);
}

/* ================== battle ================== */
const B={
  on:false,phase:'',enemy:null,toy:null,
  eHP:100,eMax:100,eHPv:100,eVis:1,eFlash:0,eShake:0,eAtk:0,eGrow:1,
  identified:false,sil:1,revealFlash:0,
  idQ:null,idIdx:0,idCorrect:-1,idDone:false,
  pHP:0,pHPv:0,pMax:1,pSend:0,pFlash:0,pShake:0,pAtk:0,
  msg:'',msgA:1,menuIdx:0,ansIdx:-1,correctIdx:-1,
  q:null,streak:0,fx:[],shake:0,cap:{vis:false,x:0,y:0,s:1,rot:0,lid:0}
};
function msg(s){B.msg=s;B.msgA=0;}
function fxNum(x,y,text,color,size){B.fx.push({x,y,text,color,size:size||17,t:0,dur:850});}
function fxStar(x,y){B.fx.push({x,y,text:'✦',color:'#ffe066',size:14,t:0,dur:700});}
function enemyDef(){return B.enemy&&B.enemy.banana?BANANA:TOYS[B.enemy.id];}
function enemyName(){return B.enemy&&B.enemy.banana?'BANANA':TOYS[B.enemy.id].name;}
function aliveFromBag(){
  for(let i=state.team.length-1;i>=0;i--)if(state.team[i].hp>0)return i;
  return -1;
}
function startBattle(id,shiny){
  const banana=id==='banana';
  const def=banana?BANANA:TOYS[id];
  const hp=Math.round(def.hp*CONFIG.enemyHP);
  state.mode='battle';
  B.on=true;
  B.enemy={id,banana,shiny:!!shiny,lvl:banana?null:ri(4,8)};
  B.eMax=hp;B.eHP=hp;B.eHPv=hp;
  B.eVis=1;B.eFlash=0;B.eShake=0;B.eAtk=0;
  B.identified=false;B.sil=1;B.revealFlash=0;
  B.idQ=null;B.idIdx=0;B.idCorrect=-1;B.idDone=false;
  B.toy=null;B.pHP=0;B.pHPv=0;B.pMax=1;B.pSend=0;
  B.pFlash=0;B.pShake=0;B.pAtk=0;
  B.q=null;B.ansIdx=-1;B.correctIdx=-1;B.streak=0;
  B.fx=[];B.shake=0;B.cap={vis:false,x:0,y:0,s:1,rot:0,lid:0};
  B.phase='intro';B.menuIdx=0;
  B.eGrow=0;
  tween(900,p=>{B.eGrow=ease(p);});
  msg('???');
  if(banana)SFX.banana();else SFX.encounter();
  after(1500,()=>{if(state.mode==='battle')sendOut();});
}
function sendOut(){
  const i=aliveFromBag();
  if(i<0){whiteout();return;}
  const m=state.team[i];
  B.toy=m;B.pHP=m.hp;B.pHPv=m.hp;B.pMax=maxHP(m.id);B.pSend=0;
  B.phase='anim';
  msg(TOYS[m.id].name+'!');
  SFX.toss();
  tween(380,p=>{B.pSend=ease(p);});
  after(760,()=>{
    if(state.mode!=='battle')return;
    if(B.phase!=='anim')return;
    if(!B.idDone)startIdentify();
    else{B.phase='menu';B.menuIdx=0;msg('');}
  });
}
function startIdentify(){
  const id=B.enemy.id;
  const pool=TOY_ORDER.filter(t=>t!==id);
  B.idQ={options:shuffle([id,...shuffle(pool).slice(0,3)])};
  B.idIdx=0;
  B.phase='id';
  msg('WHO IS IT?');
  SFX.select();
}
function answerIdentify(i){
  if(B.phase!=='id'||!B.idQ)return;
  const q=B.idQ;
  B.idIdx=i;
  B.idCorrect=q.options.indexOf(B.enemy.id);
  B.idDone=true;
  B.phase='idres';
  const right=(i===B.idCorrect);
  if(right){
    B.streak++;
    state.coins++;
    SFX.right();
    revealEnemy();
    msg('IT IS A '+enemyName()+'!');
    after(520,()=>{
      const dmg=Math.round(atkOf(B.toy.id)*1.6)+10;
      hitEnemy(dmg);
      fxNum(360,60,'BONUS!','#ffe066',15);
      SFX.crit();
    });
    after(1250,()=>{
      if(state.mode!=='battle')return;
      B.phase='menu';B.menuIdx=0;msg('');
    });
  }else{
    B.streak=0;
    SFX.wrong();
    revealEnemy();
    msg('IT IS A '+enemyName()+'!');
    after(760,()=>enemyAttack(true));
  }
}
function revealEnemy(){
  B.identified=true;
  B.revealFlash=1;
  SFX.reveal();
  tween(400,p=>{B.sil=1-ease(p);});
}
function canHear(){return !!(B.q&&B.q.hear&&B.q.audio&&audioOK());}
function askQuestion(){
  B.q=makeQuestion();
  B.menuIdx=0;B.ansIdx=-1;B.correctIdx=-1;
  B.phase='q';
  SFX.select();
  if(canHear())after(180,()=>{if(state.mode==='battle'&&B.q)speakWord(B.q.audio);});
}
function replayAudio(){if(canHear())speakWord(B.q.audio);}
function replaySlow(){if(canHear())speakWord(B.q.audio,CONFIG.slow);}
function answer(i){
  if(B.phase!=='q'||!B.q)return;
  if(i<0||i>=B.q.options.length)return;
  const q=B.q;
  B.ansIdx=i;
  B.correctIdx=q.options.indexOf(q.answer);
  B.phase='res';
  if(i===B.correctIdx){
    B.streak++;
    state.coins++;
    SFX.right();
    const bonus=Math.min(B.streak-1,4)*(CONFIG.streakBonus+state.up.streak);
    const dmg=atkOf(B.toy.id)+bonus;
    msg('YES!');
    after(280,()=>{
      tween(190,p=>{B.pAtk=ease(p);});
      after(220,()=>{
        tween(190,p=>{B.pAtk=1-ease(p);});
        hitEnemy(dmg);
        if(B.streak>=3)SFX.crit();else SFX.hit();
      });
      after(820,()=>{
        if(state.mode!=='battle')return;
        if(B.eHP<=0)enemyDown();
        else{B.phase='menu';B.menuIdx=0;msg('');}
      });
    });
  }else{
    B.streak=0;
    SFX.wrong();
    msg('NO! '+q.answer.toUpperCase());
    if(canHear())after(650,replayAudio);
    after(1450,()=>enemyAttack(false));
  }
}
function hitEnemy(dmg){
  B.eHP=Math.max(0,B.eHP-dmg);
  B.eFlash=1;B.eShake=1;B.shake=6;
  fxNum(360,74,'-'+dmg,'#ff5d5d');
}
function enemyAttack(extra){
  if(state.mode!=='battle'||!B.toy)return;
  const d=enemyDef();
  B.phase='res';
  msg(d.name+'!');
  after(320,()=>{
    tween(210,p=>{B.eAtk=ease(p);});
    after(230,()=>{
      tween(210,p=>{B.eAtk=1-ease(p);});
      const base=B.enemy.banana?(18+ri(0,8)):(10+ri(0,6)+Math.floor(B.enemy.lvl*0.8));
      const dmg=extra?Math.round(base*1.5):base;
      B.pHP=Math.max(0,B.pHP-dmg);
      B.toy.hp=B.pHP;
      B.pFlash=1;B.pShake=1;B.shake=8;
      fxNum(116,140,'-'+dmg,extra?'#ff9d3d':'#ff5d5d');
      SFX.hit();
    });
    after(980,()=>{
      if(state.mode!=='battle')return;
      if(B.pHP<=0)faint();
      else{B.phase='menu';B.menuIdx=0;msg('');}
    });
  });
}
function faint(){
  B.phase='anim';
  msg(TOYS[B.toy.id].name+' ...');
  SFX.wrong();
  after(1150,()=>{
    if(state.mode!=='battle')return;
    B.toy=null;B.pSend=0;
    if(aliveFromBag()>=0){B.phase='anim';sendOut();}
    else{whiteout();}
  });
}
function whiteout(){
  B.phase='anim';
  msg('TOO TIRED!');
  after(1250,()=>{
    if(state.mode!=='battle')return;
    state.team.forEach(t=>{t.hp=Math.max(1,Math.floor(maxHP(t.id)*0.5));});
    state.coins=Math.max(0,state.coins-5);
    endBattle();
    setMap('out',18,10,'down');
    save();
    say(['ALL TOYS TIRED!','TOYS = 1/2 HP','-5 COINS']);
  });
}
function enemyDown(){
  if(B.enemy.banana){bananaFlee();return;}
  capture();
}
function bananaFlee(){
  B.phase='anim';
  state.bananasBeaten=(state.bananasBeaten||0)+1;
  state.bananas++;
  state.coins+=6;
  msg('BANANA!');
  SFX.banana();
  after(700,()=>{msg('+1 BANANA');});
  after(1500,()=>endBattle());
}
function capture(){
  B.phase='anim';
  msg('...');
  after(620,()=>{
    msg('CHEST!');
    B.cap.vis=true;B.cap.x=150;B.cap.y=205;B.cap.s=0.92;
    B.cap.rot=0;B.cap.lid=0;
    SFX.toss();
    tween(430,p=>{
      B.cap.x=lerp(150,360,p);
      B.cap.y=lerp(205,116,p)-Math.sin(p*Math.PI)*52;
      B.cap.rot=p*4.6;
    },()=>{
      B.cap.rot=0;B.cap.x=360;B.cap.y=116;
      SFX.hit();
      tween(230,p=>{B.cap.lid=ease(p);});
      after(250,()=>{
        SFX.toss();
        tween(360,p=>{B.eVis=1-p;});
      });
      after(640,()=>{
        tween(150,p=>{B.cap.lid=1-ease(p);},()=>{SFX.hit();});
        after(170,()=>wobble(1));
      });
    });
  });
}
function wobble(n){
  tween(170,p=>{B.cap.rot=Math.sin(p*Math.PI*2)*0.4;},()=>{
    B.cap.rot=0;
    if(n<3){SFX.blip();after(230,()=>wobble(n+1));}
    else finishCapture();
  });
}
function finishCapture(){
  const id=B.enemy.id,isShiny=B.enemy.shiny;
  SFX.capture();
  msg(isShiny?'SHINY!':'CAUGHT!');
  after(780,()=>{
    tween(540,p=>{
      B.cap.x=lerp(360,52,p);
      B.cap.y=lerp(116,34,p)-Math.sin(p*Math.PI)*38;
      B.cap.s=lerp(0.92,0.5,p);
    },()=>{
      B.cap.vis=false;
      for(let i=0;i<6;i++)fxStar(52+ri(-14,14),34+ri(-8,8));
    });
  });
  after(1450,()=>{
    if(isShiny){
      if(!state.shiny.includes(id))state.shiny.push(id);
    }else if(!state.caught.includes(id)){
      state.caught.push(id);
    }
    state.coins+=8;
    const inTeam=state.team.some(t=>t.id===id&&!!t.shiny===isShiny);
    if(!inTeam&&state.team.length<bagMax()){
      state.team.push({id,hp:maxHP(id),shiny:isShiny});

  });

  stopSpeech();

  state.mode='world';

  if(state.caught.length>=TOY_ORDER.length&&!state.winShown){

function updateBattle(dt){
  B.eFlash=Math.max(0,B.eFlash-dt/260);
  B.pFlash=Math.max(0,B.pFlash-dt/260);
  B.eShake=Math.max(0,B.eShake-dt/280);
  B.pShake=Math.max(0,B.pShake-dt/280);
  B.revealFlash=Math.max(0,B.revealFlash-dt/320);
  B.shake=Math.max(0,B.shake-dt/48);
  B.msgA=Math.min(1,B.msgA+dt/140);
  B.eHPv+=(B.eHP-B.eHPv)*Math.min(1,dt/130);
  B.pHPv+=(B.pHP-B.pHPv)*Math.min(1,dt/130);
  for(let i=B.fx.length-1;i>=0;i--){
    const f=B.fx[i];f.t+=dt;
    if(f.t>f.dur)B.fx.splice(i,1);
  }
}

function camera(){
  const px=worldX()+T/2,py=worldY()+T/2;
  const mw=MAP.w*T,mh=MAP.h*T;
  let cx=px-VW/2,cy=py-VH/2;
  cx=mw<VW?(mw-VW)/2:clamp(cx,0,mw-VW);
  cy=mh<VH?(mh-VH)/2:clamp(cy,0,mh-VH);
  return {x:cx,y:cy};
}

function drawGround(ch,gx,gy){
  const sx=gx*T,sy=gy*T;
  if(MAP.kind!=='out'){
    if(ch==='#'){
      ctx.fillStyle='#57406b';ctx.fillRect(sx,sy,T,T);
      ctx.fillStyle='#6b4f80';ctx.fillRect(sx,sy,T,7);
      ctx.fillStyle='#43304f';ctx.fillRect(sx,sy+T-6,T,6);
    }else{
      ctx.fillStyle=MAP.floor||'#e0b078';ctx.fillRect(sx,sy,T,T);
      ctx.fillStyle='rgba(0,0,0,.06)';
      ctx.fillRect(sx,sy+15,T,2);ctx.fillRect(sx,sy+31,T,2);
    }
    if(ch==='s'){
      box(sx+2,sy+2,T-4,T-4,3,'#8a5a2b','#4a3826',2);

    }

      box(sx+4,sy+4,T-8,T-8,2,'#8a5a2b','#4a3826',3);
      ctx.fillStyle='#f2c14e';
      ctx.beginPath();ctx.arc(sx+22,sy+18,2,0,7);ctx.fill();
    }
    return;
  }
  const v=hash(gx,gy);
  ctx.fillStyle=v>0.5?'#8fd189':'#96d68f';
  ctx.fillRect(sx,sy,T,T);
  if(ch==='p'){
    ctx.fillStyle='#efd9a4';ctx.fillRect(sx,sy,T,T);

    for(let i=0;i<3;i++){
      const hh=hash(gx*7+i,gy*13+i);
      ctx.fillRect(sx+4+hh*22,sy+5+((hh*17)%20),3,2);
    }

  if(ch==='g'){
    ctx.fillStyle='#79c274';ctx.fillRect(sx,sy,T,T);
    for(let i=0;i<4;i++){
      const bx=sx+3+i*8,by=sy+6+((i%2)*6);

      ctx.beginPath();ctx.moveTo(bx,by+18);ctx.lineTo(bx+3,by);

    }

  if(ch==='#'){ctx.fillStyle='#7ec87a';ctx.fillRect(sx,sy,T,T);drawTree(sx,sy);}

const MIX_ROWS=[
  {k:'listen',label:'HEAR WORD'},

  {k:'picchoice',label:'HEAR > PIC'},

];
const GAME_ROWS=[

];
let setTab=0,setRow=0,wordScroll=0,resetArmed=false;

function wordRows(){
  const rows=[];
  rows.push({t:'all',label:'TURN ALL ON'});
  rows.push({t:'head',label:'CVC WORDS'});
  WORDS.forEach(o=>rows.push({t:'cvc',key:o.w,label:o.w.toUpperCase()}));
  rows.push({t:'head',label:'LESSON WORDS'});
  rows.push({t:'vgroup',key:'colour',label:'COLOURS'});
  rows.push({t:'vgroup',key:'family',label:'FAMILY'});
  rows.push({t:'head',label:'PREPOSITIONS'});
  RELS.forEach(r=>rows.push({t:'rel',key:r,label:r.toUpperCase()}));
  return rows;
}
function rowOn(r){
  if(r.t==='cvc')return CONFIG.enabled.cvc.indexOf(r.key)>=0;
  if(r.t==='vgroup')return CONFIG.enabled.vocab.indexOf(r.key)>=0;
  if(r.t==='rel')return CONFIG.enabled.rel.indexOf(r.key)>=0;
  return false;
}
function rowToggle(r){
  let list,min;
  if(r.t==='cvc'){list=CONFIG.enabled.cvc;min=4;}
  else if(r.t==='vgroup'){list=CONFIG.enabled.vocab;min=1;}
  else if(r.t==='rel'){list=CONFIG.enabled.rel;min=4;}
  else return;
  const i=list.indexOf(r.key);
  if(i>=0){
    if(list.length<=min){SFX.deny();return;}
    list.splice(i,1);
  }else list.push(r.key);
  saveSettings();
  SFX.blip();
}
function tabRows(){
  if(setTab===0)return MIX_ROWS;
  if(setTab===1)return GAME_ROWS;
  return wordRows();
}
function setValueText(){
  if(setTab===0)return String(CONFIG.mix[MIX_ROWS[setRow].k]||0);
  if(setTab===1){
    const k=GAME_ROWS[setRow].k;
    if(k==='speed')return 'x'+CONFIG.speed.toFixed(1);
    if(k==='hp')return 'x'+CONFIG.enemyHP.toFixed(1);
    return Math.round(CONFIG.encounterRate*100)+'%';
  }
  return '';

function setAdjust(dir){
  if(setTab===0){
    const k=MIX_ROWS[setRow].k;
    CONFIG.mix[k]=clamp((CONFIG.mix[k]||0)+dir*2,0,60);

    else if(k==='hp')CONFIG.enemyHP=clamp(Math.round((CONFIG.enemyHP+dir*0.1)*10)/10,0.5,2);

/* ================== update ================== */
function dirHeld(){
  const k=keys;
  if(k['arrowup']||k['w']||touchDir==='up')return {x:0,y:-1};
  if(k['arrowdown']||k['s']||touchDir==='down')return {x:0,y:1};
  if(k['arrowleft']||k['a']||touchDir==='left')return {x:-1,y:0};
  if(k['arrowright']||k['d']||touchDir==='right')return {x:1,y:0};
  return null;
}
function interact(){
  const dx=player.dir==='left'?-1:player.dir==='right'?1:0;
  const dy=player.dir==='up'?-1:player.dir==='down'?1:0;
  const fx=player.gx+dx,fy=player.gy+dy;
  const npc=MAP.npcs.find(n=>n.x===fx&&n.y===fy);
  if(npc){
    panelIdx=0;
    if(npc.type==='prof')panel='prof';
    else if(npc.type==='shop')panel='shop';
    else panel='heal';
    SFX.select();
    return;
  }
  const sg=MAP.signs.find(s=>s.x===fx&&s.y===fy);
  if(sg){SFX.blip();say([sg.text]);return;}
}
function updateWorld(dt){
  if(move){
    move.t=Math.min(1,move.t+dt/112);
    if(move.t>=1){
      player.gx=move.tx;player.gy=move.ty;
      move=null;player.walk=0;
      onStep();
    }
  }else if(!dlg.on&&!trans&&!winOpen&&!panel){
    const d=dirHeld();
    if(d)tryMove(d.x,d.y);
  }
}
function update(dt){
  updateTimers(dt);
  updateTrans(dt);
  if(state.mode==='battle')updateBattle(dt);
  else if(state.mode==='world')updateWorld(dt);
}

function toggleMute(){muted=!muted;if(muted)stopSpeech();else SFX.blip();}
function openSettings(){panel='settings';setTab=0;setRow=0;wordScroll=0;resetArmed=false;SFX.select();}

function buyAt(i){
  if(i<4){
    const u=UPGRADES[i],c=costOf(u);
    if(state.coins<c){SFX.deny();return;}
    state.coins-=c;state.up[u.id]++;
    if(u.id==='hp')state.team.forEach(t=>{t.hp+=12;});
    SFX.coin();save();
  }else{
    if(state.coins<15){SFX.deny();return;}
    state.coins-=15;state.bananas++;SFX.coin();save();
  }
}
function doHeal(){
  if(state.bananas<=0){SFX.deny();return;}
  state.bananas--;
  state.team.forEach(t=>{t.hp=maxHP(t.id);});
  SFX.heal();save();
}
function claimQuest(){
  if(state.quest>=QUESTS.length)return;
  const q=QUESTS[state.quest];
  if(!q.ok(state)){SFX.deny();return;}
  state.coins+=q.coins;
  state.quest++;
  SFX.coin();save();
}
function panelKey(k){
  if(k==='escape'||k==='x'){panel=null;SFX.blip();return;}
  if(panel==='settings'){
    if(k==='tab'){switchTab(setTab+1);return;}
    if(k==='arrowdown'){
      const n=tabRows().length;
      setRow=(setRow+1)%n;resetArmed=false;SFX.blip();
    }else if(k==='arrowup'){
      const n=tabRows().length;
      setRow=(setRow+n-1)%n;resetArmed=false;SFX.blip();
    }else if(k==='arrowleft'){
      if(setTab===2)switchTab(setTab-1);else setAdjust(-1);
    }else if(k==='arrowright'){
      if(setTab===2)switchTab(setTab+1);else setAdjust(1);
    }else if(k==='z'||k==='enter'||k===' '){
      if(setTab===0||setTab===1)setAdjust(1);
      else{
        const r=wordRows()[setRow];
        if(r.t==='all'){
          CONFIG.enabled.cvc=WORDS.map(o=>o.w);
          CONFIG.enabled.vocab=['colour','family'];
          CONFIG.enabled.rel=RELS.slice();
          saveSettings();SFX.coin();
        }else if(r.t==='head'){SFX.blip();}
        else rowToggle(r);
      }
    }
    return;
  }
  if(panel==='shop'){
    if(k==='arrowdown'){panelIdx=(panelIdx+1)%5;SFX.blip();}
    else if(k==='arrowup'){panelIdx=(panelIdx+4)%5;SFX.blip();}
    else if(k==='z'||k==='enter'||k===' ')buyAt(panelIdx);
    return;
  }
  if(panel==='heal'){
    if(k==='z'||k==='enter'||k===' ')doHeal();
    return;
  }
  if(panel==='prof'){
    if(k==='z'||k==='enter'||k===' ')claimQuest();
    return;
  }
}
function menuSelect(){
  if(B.menuIdx===0)askQuestion();
  else{
    B.phase='anim';msg('BYE!');
    after(900,()=>{if(state.mode==='battle')endBattle();});
  }
}
function battleKey(k){
  if(!B.on)return;
  if(B.phase==='id'){
    if(k>='1'&&k<='4'){answerIdentify(parseInt(k,10)-1);return;}
    if(k==='arrowdown'||k==='arrowright'){B.idIdx=(B.idIdx+1)%4;SFX.blip();}
    else if(k==='arrowup'||k==='arrowleft'){B.idIdx=(B.idIdx+3)%4;SFX.blip();}
    else if(k==='z'||k==='enter'||k===' ')answerIdentify(B.idIdx);
    return;
  }
  if(B.phase==='menu'){
    if(k==='arrowright'||k==='arrowdown'||k==='arrowleft'||k==='arrowup'){
      B.menuIdx=(B.menuIdx+1)%2;SFX.blip();
    }else if(k==='z'||k==='enter'||k===' ')menuSelect();
    return;
  }
  if(B.phase==='q'){
    if(k==='s'){replayAudio();return;}
    if(k==='a'){replaySlow();return;}
    if(k>='1'&&k<='4'){answer(parseInt(k,10)-1);return;}
    if(k==='arrowdown'){B.menuIdx=clamp(B.menuIdx+2,0,3);SFX.blip();}
    else if(k==='arrowup'){B.menuIdx=clamp(B.menuIdx-2,0,3);SFX.blip();}
    else if(k==='arrowright'){B.menuIdx=clamp(B.menuIdx+1,0,3);SFX.blip();}
    else if(k==='arrowleft'){B.menuIdx=clamp(B.menuIdx-1,0,3);SFX.blip();}
    else if(k==='z'||k==='enter'||k===' ')answer(B.menuIdx);
    return;
  }
}
function onKey(k){
  if(k==='t'){
    unlockSpeech();
    if(audioOK())speakWord('cat');else SFX.blip();
    return;
  }
  if(panel){panelKey(k);return;}
  if(winOpen){
    if(k==='r')resetGame();
    else if(k==='z'||k==='enter'||k===' '||k==='escape')winOpen=false;
    return;
  }
  if(state.mode==='title'){
    if(k==='r'){resetGame();return;}
    if(k==='z'||k==='enter'||k===' '){
      if(state.starter&&state.team.length)startGame();
      else{SFX.select();state.mode='starter';starterIdx=0;}
    }
    return;
  }
  if(state.mode==='starter'){
    const list=starterList();
    if(k==='arrowright'||k==='d'){starterIdx=(starterIdx+1)%list.length;SFX.blip();}
    else if(k==='arrowleft'||k==='a'){starterIdx=(starterIdx+list.length-1)%list.length;SFX.blip();}
    else if(k==='arrowdown'||k==='s'){starterIdx=Math.min(starterIdx+8,list.length-1);SFX.blip();}
    else if(k==='arrowup'||k==='w'){starterIdx=Math.max(starterIdx-8,0);SFX.blip();}
    else if(k==='z'||k==='enter'||k===' '){pickStarter(list[starterIdx]);}
    return;
  }
  if(dlg.on){
    if(k==='z'||k==='enter'||k===' ')nextDlg();
    return;
  }
  if(k==='m'){toggleMute();return;}
  if(state.mode==='battle'){battleKey(k);return;}
  if(state.mode==='world'){
    if(k==='z'||k==='enter'||k===' ')interact();
  }
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0)e.preventDefault();
  keys[k]=true;
  if(e.repeat)return;
  if(!AC)ac();
  unlockSpeech();
  onKey(k);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const DPAD={x:24,y:262,s:32};
const ABTN={x:416,y:286,r:24};
function virtPos(e){
  const r=cvs.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};
}
function inRect(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}
function drawTouch(){
  ctx.globalAlpha=0.55;
  const cx=DPAD.x+DPAD.s,cy=DPAD.y+DPAD.s;
  box(cx-DPAD.s,cy-DPAD.s,DPAD.s*2,DPAD.s*2,12,'rgba(20,24,40,.55)','#f8f8f0',2);
  txt('▲',cx,cy-DPAD.s+17,13,'#f8f8f0','center');
  txt('▼',cx,cy+DPAD.s-6,13,'#f8f8f0','center');
  txt('◀',cx-DPAD.s+9,cy+5,13,'#f8f8f0','center');
  txt('▶',cx+DPAD.s-9,cy+5,13,'#f8f8f0','center');
  ctx.beginPath();ctx.arc(ABTN.x,ABTN.y,ABTN.r,0,7);
  ctx.fillStyle='rgba(20,24,40,.55)';ctx.fill();
  ctx.strokeStyle='#f8f8f0';ctx.lineWidth=2;ctx.stroke();
  txt('Z',ABTN.x,ABTN.y+6,15,'#f8f8f0','center');
  ctx.globalAlpha=1;
}
function settingsHit(p){
  if(!inRect(p,14,8,452,336)){panel=null;return;}
  for(let i=0;i<3;i++){
    if(inRect(p,26+i*140,18,136,24)){switchTab(i);return;}
  }
  if(setTab===0){
    for(let i=0;i<MIX_ROWS.length;i++){
      const y=54+i*32;
      if(inRect(p,24,y,432,27)){
        setRow=i;resetArmed=false;
        if(inRect(p,296,y+3,40,21))setAdjust(-1);
        else if(inRect(p,400,y+3,40,21))setAdjust(1);
        return;
      }
    }
    return;
  }
  if(setTab===1){
    for(let i=0;i<GAME_ROWS.length;i++){
      const y=54+i*32;
      if(inRect(p,24,y,432,27)){
        setRow=i;
        if(inRect(p,296,y+3,40,21))setAdjust(-1);
        else if(inRect(p,400,y+3,40,21))setAdjust(1);
        return;
      }
    }
    return;
  }
  const rows=wordRows();
  for(let i=0;i<13;i++){
    const idx=wordScroll+i;
    if(idx>=rows.length)break;
    const y=52+i*19;
    if(inRect(p,24,y,404,18)){
      setRow=idx;
      const r=rows[idx];
      if(r.t==='all'){
        CONFIG.enabled.cvc=WORDS.map(o=>o.w);
        CONFIG.enabled.vocab=['colour','family'];
        CONFIG.enabled.rel=RELS.slice();
        saveSettings();SFX.coin();
      }else if(r.t!=='head')rowToggle(r);
      return;
    }
  }
}
cvs.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!AC)ac();
  unlockSpeech();
  const p=virtPos(e);

  if(inRect(p,436,6,44,32)){openSettings();return;}

  if(panel){
    if(panel==='settings'){settingsHit(p);return;}
    if(panel==='shop'){
      for(let i=0;i<5;i++){
        if(inRect(p,46,100+i*34,388,30)){panelIdx=i;buyAt(i);return;}
      }
      if(inRect(p,46,270,388,34)){panel=null;return;}
      return;
    }
    if(panel==='heal'){
      if(inRect(p,60,262,360,34)){doHeal();return;}
      panel=null;return;
    }
    if(panel==='prof'){
      if(inRect(p,120,200,240,30)){claimQuest();return;}
      panel=null;return;
    }
    return;
  }
  if(winOpen){
    if(inRect(p,64,240,166,32))resetGame();
    else winOpen=false;
    return;
  }
  if(state.mode==='title'){onKey('z');return;}
  if(state.mode==='starter'){
    const list=starterList();
    for(let i=0;i<list.length;i++){
      const col=i%8,row=Math.floor(i/8);
      const cw=52,ch=52;
      const totalW=8*cw+7*4;
      const x0=VW/2-totalW/2;
      const x=x0+col*(cw+4);
      const y=46+row*(ch+8);
      if(inRect(p,x,y,cw,ch)){starterIdx=i;pickStarter(list[i]);return;}
    }
    return;
  }
  if(state.mode==='battle'){
    if(B.phase==='id'){
      const xs=[26,134,242,350];
      for(let i=0;i<B.idQ.options.length;i++){
        if(inRect(p,xs[i],256,104,88)){answerIdentify(i);return;}
      }
    }else if(B.phase==='q'){
      if(canHear()&&inRect(p,188,40,124,92)){replayAudio();return;}
      const pos=[[20,240],[248,240],[20,292],[248,292]];
      for(let i=0;i<4;i++){
        if(inRect(p,pos[i][0],pos[i][1],212,46)){answer(i);return;}
      }
    }else if(B.phase==='menu'){
      const pos=[[28,238,196,88],[256,238,196,88]];
      for(let i=0;i<2;i++){
        if(inRect(p,pos[i][0],pos[i][1],pos[i][2],pos[i][3])){
          B.menuIdx=i;menuSelect();return;
        }
      }
    }
    return;
  }
  if(state.mode==='world'){
    if(dlg.on){nextDlg();return;}
    const cx=DPAD.x+DPAD.s,cy=DPAD.y+DPAD.s;
    if(p.x<cx+DPAD.s+10&&p.x>cx-DPAD.s-10&&p.y<cy+DPAD.s+10&&p.y>cy-DPAD.s-10){
      const dx=p.x-cx,dy=p.y-cy;
      touchDir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
      return;
    }
    if(Math.hypot(p.x-ABTN.x,p.y-ABTN.y)<ABTN.r+24){interact();return;}
    touchDir=null;
  }
});
cvs.addEventListener('pointerup',()=>{touchDir=null;});
cvs.addEventListener('pointercancel',()=>{touchDir=null;});
cvs.addEventListener('pointerleave',()=>{touchDir=null;});
cvs.addEventListener('contextmenu',e=>e.preventDefault());

/* ================== boot ================== */
loadSettings();
load();
setMap('out',6,12,'up');
let lastT=performance.now();
function frame(ts){
  const dt=Math.min(48,ts-lastT);
  lastT=ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
</script>
