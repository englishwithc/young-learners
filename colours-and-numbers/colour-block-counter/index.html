<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Block Counter!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'cursive';
            background-color: #fff0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }

        #game-container {
            background: white;
            border: 8px solid #4db8ff;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 0 #2a85c2;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #ff69b4;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px #ffd1dc;
        }

        /* Toggle Switch Styling */
        .mode-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #fefefe;
            padding: 10px;
            border-radius: 50px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 2px solid #ddd;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #ff69b4; }
        input:checked + .slider:before { transform: translateX(26px); }

        #star-counter {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .star {
            font-size: 3rem;
            color: #ccc;
            transition: color 0.3s;
            cursor: default;
        }

        .star.earned {
            color: #ffdf00;
            text-shadow: 0 0 10px #fff700;
        }

        #block-pit {
            position: relative;
            width: 100%;
            height: 400px;
            background-color: #f9f9f9;
            border: 4px solid #ddd;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .block {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            border: 3px solid rgba(0,0,0,0.2);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }

        .block:active { transform: scale(0.8); }

        .block.counted {
            opacity: 0.4;
            transform: scale(0.8);
            border-color: white;
        }

        /* Floating Animation */
        @keyframes float {
            0% { transform: translate(0, 0); }
            25% { transform: translate(15px, -15px); }
            50% { transform: translate(-10px, 10px); }
            75% { transform: translate(-15px, -10px); }
            100% { transform: translate(0, 0); }
        }

        .block.moving {
            animation: float 4s ease-in-out infinite;
        }

        #answer-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .count-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0f8ff;
            padding: 15px;
            border-radius: 20px;
            border: 3px solid #b0e2ff;
            min-width: 120px;
        }

        .color-label {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .color-preview {
            width: 20px;
            height: 20px;
            display: inline-block;
            border-radius: 4px;
            margin-right: 5px;
            border: 1px solid #000;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-small {
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 3px 0 #ccc;
        }

        .btn-small:active { transform: translateY(2px); box-shadow: 0 1px 0 #ccc; }

        .count-value {
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        #confirm-btn {
            background: #ffcc00;
            color: #553300;
            font-size: 2rem;
            padding: 15px 60px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 0 #cca300;
            font-family: inherit;
            font-weight: bold;
        }

        #confirm-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #cca300; }

        #message {
            font-size: 1.5rem;
            margin-top: 20px;
            height: 30px;
            font-weight: bold;
        }

        .win-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Block Counter! 🟦</h1>
        
        <div class="mode-switch">
            <span>Easy</span>
            <label class="switch">
                <input type="checkbox" id="move-toggle">
                <span class="slider"></span>
            </label>
            <span>Moving Blocks! 🌪️</span>
        </div>

        <p style="font-size: 1.2rem;">Click the blocks to mark them, then count them!</p>
        
        <div id="star-counter">
            <span class="star" id="s1">★</span>
            <span class="star" id="s2">★</span>
            <span class="star" id="s3">★</span>
            <span class="star" id="s4">★</span>
            <span class="star" id="s5">★</span>
        </div>

        <div id="block-pit"></div>

        <div id="answer-area"></div>

        <button id="confirm-btn">Check! ✅</button>
        <div id="message"></div>
    </div>

    <div class="win-screen" id="win-screen">
        <h1 style="font-size: 4rem;">🏆 AMAZING! 🏆</h1>
        <p style="font-size: 2rem;">You are a counting genius!</p>
        <button id="restart-btn" style="font-size: 1.5rem; padding: 15px 40px; border-radius: 20px; cursor:pointer; background: #4db8ff; color: white; border: none;">Play Again!</button>
    </div>

    <script>
        const allColors = {
            'Red': '#ff4d4d',
            'Blue': '#4d94ff',
            'Green': '#4dff88',
            'Yellow': '#ffff4d',
            'Orange': '#ffae42',
            'Purple': '#b366ff',
            'Pink': '#ff66b2',
            'Grey': '#a6a6a6',
            'Brown': '#8b4513',
            'Black': '#333333'
        };

        let starsEarned = 0;
        let currentRoundData = {}; 
        let userAnswers = {};

        function initRound() {
            const pit = document.getElementById('block-pit');
            const answerArea = document.getElementById('answer-area');
            const message = document.getElementById('message');
            const isMovingEnabled = document.getElementById('move-toggle').checked;
            
            pit.innerHTML = '';
            answerArea.innerHTML = '';
            message.innerText = '';
            userAnswers = {};
            currentRoundData = {};

            const colorKeys = Object.keys(allColors).sort(() => 0.5 - Math.random()).slice(0, 4);

            colorKeys.forEach(colorName => {
                const count = Math.floor(Math.random() * 10) + 1;
                currentRoundData[colorName] = count;
                userAnswers[colorName] = 0;

                for(let i = 0; i < count; i++) {
                    const block = document.createElement('div');
                    block.className = 'block';
                    block.style.backgroundColor = allColors[colorName];
                    
                    const posX = Math.random() * (pit.clientWidth - 60);
                    const posY = Math.random() * (pit.clientHeight - 60);
                    block.style.left = posX + 'px';
                    block.style.top = posY + 'px';
                    
                    // If toggle is on, add moving class and randomize animation
                    if(isMovingEnabled) {
                        block.classList.add('moving');
                        block.style.animationDuration = (3 + Math.random() * 3) + 's';
                        block.style.animationDelay = (Math.random() * 2) + 's';
                    }

                    block.onclick = () => block.classList.toggle('counted');
                    pit.appendChild(block);
                }

                const group = document.createElement('div');
                group.className = 'count-group';
                group.innerHTML = `
                    <div class="color-label">
                        <span class="color-preview" style="background:${allColors[colorName]}"></span> ${colorName}
                    </div>
                    <div class="counter-controls">
                        <button class="btn-small" onclick="changeValue('${colorName}', -1)">-</button>
                        <div class="count-value" id="val-${colorName}">0</div>
                        <button class="btn-small" onclick="changeValue('${colorName}', 1)">+</button>
                    </div>
                `;
                answerArea.appendChild(group);
            });
        }

        // Handle the toggle switch during the game
        document.getElementById('move-toggle').onchange = function() {
            const blocks = document.querySelectorAll('.block');
            blocks.forEach(block => {
                if(this.checked) {
                    block.classList.add('moving');
                    block.style.animationDuration = (3 + Math.random() * 3) + 's';
                    block.style.animationDelay = (Math.random() * 2) + 's';
                } else {
                    block.classList.remove('moving');
                }
            });
        };

        window.changeValue = function(color, delta) {
            userAnswers[color] = Math.max(0, Math.min(10, userAnswers[color] + delta));
            document.getElementById(`val-${color}`).innerText = userAnswers[color];
        };

        document.getElementById('confirm-btn').onclick = function() {
            let allCorrect = true;
            for (let color in currentRoundData) {
                if (userAnswers[color] !== currentRoundData[color]) {
                    allCorrect = false;
                    break;
                }
            }

            const message = document.getElementById('message');
            if (allCorrect) {
                message.innerText = "Wow! Perfect counting! ⭐";
                message.style.color = "green";
                starsEarned++;
                updateStars();
                
                if (starsEarned >= 5) {
                    showWinScreen();
                } else {
                    setTimeout(initRound, 2000);
                }
            } else {
                message.innerText = "Not quite! Try counting again! 🧐";
                message.style.color = "red";
            }
        };

        function updateStars() {
            for (let i = 1; i <= 5; i++) {
                const s = document.getElementById(`s${i}`);
                if (i <= starsEarned) s.classList.add('earned');
            }
        }

        function showWinScreen() {
            document.getElementById('win-screen').style.display = 'flex';
            confetti({
                particleCount: 200,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        document.getElementById('restart-btn').onclick = function() {
            starsEarned = 0;
            updateStars();
            document.getElementById('win-screen').style.display = 'none';
            initRound();
        };

        initRound();
    </script>
</body>
</html>
